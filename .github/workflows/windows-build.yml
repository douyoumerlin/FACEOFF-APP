name: Application Windows

# Compile l'installateur Windows de FaceOff (.exe NSIS et .msi).
# - Lancement manuel : onglet "Actions" > "Application Windows" > "Run workflow".
#   Les installateurs sont téléchargeables dans les "Artifacts" du run.
# - Tag "v*" (ex. v1.0.0) : crée en plus un brouillon de Release GitHub avec les installateurs.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Compiler et publier (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FaceOff ${{ github.ref_name }}'
          releaseBody: "Installateur Windows de FaceOff by GOAT225. Télécharge le fichier .exe ci-dessous."
          releaseDraft: true

      - name: Compiler (manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run tauri build

      - name: Mettre les installateurs à disposition
        uses: actions/upload-artifact@v4
        with:
          name: FaceOff-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
